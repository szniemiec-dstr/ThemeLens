name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  portable:
    # Core and Engine have no Windows dependency and must build and pass on both systems (NFR-07).
    name: Build, Core tests and Specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build everything
        run: dotnet build ThemeLens.slnx -c Release

      - name: Core tests
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --project tests/ThemeLens.Core.Tests -c Release --no-build

      # Section 9.4: line coverage of Core at least 90%. Measured once, on Linux.
      - name: Core tests, with line coverage of Core at least 90%
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test --project tests/ThemeLens.Core.Tests -c Release --no-build
          --coverlet --coverlet-include "[ThemeLens.Core]*"
          --coverlet-threshold 90 --coverlet-threshold-type line --coverlet-threshold-stat Total

      - name: Specs
        run: dotnet test --project tests/ThemeLens.Specs -c Release --no-build

      # NFR-09: every shipped dependency carries a licence on the allow-list, and the notices file is current.
      - name: Dependency licences
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet run build/check-licences.cs --
          src/ThemeLens.Core src/ThemeLens.Engine src/ThemeLens.Platform.Windows src/ThemeLens.App

      - name: Keep the pictures of failed golden comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-differences-${{ matrix.os }}
          path: tests/ThemeLens.Specs/Goldens/**/*.received.png
          if-no-files-found: ignore

  platform:
    # The GPU shader has to give the same pixels as the CPU reference renderer. Hosted runners have no GPU, so
    # this runs on the software rasteriser, which is also the CPU-only path of section 7.6.
    name: Platform tests (Windows, software rasteriser)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ThemeLens.slnx -c Release

      - name: Shader against the reference renderer
        run: dotnet test --project tests/ThemeLens.Platform.Tests -c Release --no-build --filter-not-trait "Category=Ui"

      # These create real windows and need a desktop session, which the hosted Windows runners have.
      - name: Lens window tests
        timeout-minutes: 5
        run: dotnet test --project tests/ThemeLens.Platform.Tests -c Release --no-build --filter-class "*LensWindowTests"

      # The whole lens, started as the app starts it: windows, composition, frame loop, capture. It shows that
      # the parts start and keep running on a real Windows desktop. Nobody looks at the picture here.
      - name: The whole lens on this desktop
        timeout-minutes: 5
        run: dotnet test --project tests/ThemeLens.Platform.Tests -c Release --no-build --filter-class "*LensRuntimeSmokeTests"

      # The app itself, started as a user starts it and driven through UI Automation.
      - name: The app on this desktop
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: dotnet test --project tests/ThemeLens.UiTests -c Release --no-build
